name: estora

# Full WordPress deployment for a single free VM (Oracle Cloud Always Free,
# or any Ubuntu box with Docker). HTTPS is handled by Caddy.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-estora}
      MYSQL_USER: ${MYSQL_USER:-estora}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-estora}
      WORDPRESS_DB_USER: ${MYSQL_USER:-estora}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', false );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_DEBUG_LOG', false );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_AUTO_UPDATE_CORE', 'minor' );
        // Public portfolio deployment: allows the demo seeder, no debug output.
        define( 'WP_ENVIRONMENT_TYPE', 'development' );
    volumes:
      - wp_data:/var/www/html
      - ../../wp-content/themes/estora-theme:/var/www/html/wp-content/themes/estora-theme:ro
      - ../../wp-content/plugins/estora-core:/var/www/html/wp-content/plugins/estora-core:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 30

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-estora}
      WORDPRESS_DB_USER: ${MYSQL_USER:-estora}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
    volumes:
      - wp_data:/var/www/html
      - ../../wp-content/themes/estora-theme:/var/www/html/wp-content/themes/estora-theme
      - ../../wp-content/plugins/estora-core:/var/www/html/wp-content/plugins/estora-core
      - ../../:/opt/estora
    entrypoint: ["wp"]
    working_dir: /var/www/html

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      EMAIL: ${EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  wp_data:
  caddy_data:
  caddy_config:
