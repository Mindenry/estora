name: estora

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-estora}
      MYSQL_USER: ${MYSQL_USER:-estora}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-estora_local_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-estora_local_root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-estora_local_root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-estora}
      WORDPRESS_DB_USER: ${MYSQL_USER:-estora}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-estora_local_db}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/estora-theme:/var/www/html/wp-content/themes/estora-theme
      - ./wp-content/plugins/estora-core:/var/www/html/wp-content/plugins/estora-core
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12

  cli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-estora}
      WORDPRESS_DB_USER: ${MYSQL_USER:-estora}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-estora_local_db}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WP_CLI_CACHE_DIR: /tmp/.wp-cli-cache
      WP_CLI_PACKAGES_DIR: /tmp/.wp-cli
      WP_CLI_ALLOW_ROOT: 0
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/estora-theme:/var/www/html/wp-content/themes/estora-theme
      - ./wp-content/plugins/estora-core:/var/www/html/wp-content/plugins/estora-core
      - ./:/opt/estora
      - ./scripts:/opt/estora-scripts:ro
    entrypoint: ["wp"]
    working_dir: /var/www/html

  pma:
    image: phpmyadmin:5
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M

volumes:
  db_data:
  wp_data:
